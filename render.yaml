# Render Blueprint — free web service, no credit card needed.
# Render dashboard → New → Blueprint → pick this repo/branch.
#
# Free-tier notes:
#  • Sleeps after 15 min without traffic — point a free pinger
#    (e.g. cron-job.org) at https://<your-app>.onrender.com/healthz every 10 min.
#  • The filesystem is ephemeral: the SQLite DB (users, custom sources) resets
#    whenever Render restarts/redeploys the service. Feeds re-fetch automatically,
#    and the admin account is recreated with ADMIN_INITIAL_PASSWORD.
services:
  - type: web
    name: threatpulse
    runtime: docker
    plan: free
    branch: security-fixes
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # random secret generated by Render
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true          # see it under Environment in the dashboard
      - key: DB_PATH
        value: /tmp/threatpulse.db
      - key: ARTICLE_RETENTION_DAYS   # delete articles older than this (reviewed / PoC-decided ones are kept); 0 = keep all
        value: "90"
      - key: FETCH_CRON
        value: "*/15 * * * *"
      # Set these after the first deploy, once you know your URL:
      - key: BASE_URL
        sync: false                  # e.g. https://threatpulse-xxxx.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false                  # same as BASE_URL
      - key: ADMIN_EMAIL
        sync: false                  # your address: lets the admin use "Forgot password"
      # Registration is invite-only (codes from Admin → Invite Codes).
      - key: REQUIRE_INVITE_CODE
        value: "true"
      # Email (password resets, verification codes, alerts). Render's free tier
      # blocks SMTP, so mail goes out over Brevo's HTTPS API (free: 300/day).
      - key: BREVO_API_KEY
        sync: false                  # Brevo → SMTP & API → API Keys
      - key: MAIL_FROM
        sync: false                  # sender address verified in Brevo → Senders
      - key: MAIL_FROM_NAME
        value: ThreatPulse
      # Optional API keys
      - key: NVD_API_KEY
        sync: false
      - key: GITHUB_TOKEN   # PoC checker (5,000 GitHub API req/h) and, with BACKUP_GITHUB_REPO, the DB backup
        sync: false
      # Keep the database across restarts, option 1: a PRIVATE GitHub repo (owner/repo)
      - key: BACKUP_GITHUB_REPO
        sync: false
      # Option 2: S3-compatible bucket (Backblaze B2, Cloudflare R2)
      - key: BACKUP_S3_ENDPOINT   # e.g. https://s3.us-east-005.backblazeb2.com
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: ABUSE_CH_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
