# Render Blueprint — free web service, no credit card needed.
# Render dashboard → New → Blueprint → pick this repo/branch.
#
# Free-tier notes:
#  • Sleeps after 15 min without traffic — point a free pinger
#    (e.g. cron-job.org) at https://<your-app>.onrender.com/healthz every 10 min.
#  • The filesystem is ephemeral: the SQLite DB (users, custom sources) resets
#    whenever Render restarts/redeploys the service. Feeds re-fetch automatically,
#    and the admin account is recreated with ADMIN_INITIAL_PASSWORD.
services:
  - type: web
    name: threatpulse
    runtime: docker
    plan: free
    branch: security-fixes
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # random secret generated by Render
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true          # see it under Environment in the dashboard
      - key: DB_PATH
        value: /tmp/threatpulse.db
      - key: FETCH_CRON
        value: "*/15 * * * *"
      # Set these after the first deploy, once you know your URL:
      - key: BASE_URL
        sync: false                  # e.g. https://threatpulse-xxxx.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false                  # same as BASE_URL
      - key: ADMIN_EMAIL
        sync: false
      # Optional API keys
      - key: NVD_API_KEY
        sync: false
      - key: ABUSE_CH_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
