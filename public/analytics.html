<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics · ThreatPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/enterprise.css">
  <link rel="stylesheet" href="/css/analytics.css">
  <meta name="theme-color" content="#10151f">
  <script>
    // Apply saved theme before first paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem('tp_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="an-body">
  <header class="header">
    <div class="header-left">
      <a class="logo" href="/" style="text-decoration:none;">
        <span class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <h1 class="logo-text">Threat<span class="logo-accent">Pulse</span></h1>
      </a>
      <nav class="an-nav" aria-label="Views">
        <a href="/">Dashboard</a>
        <a href="/analytics" aria-current="page">Analytics</a>
      </nav>
    </div>
    <div class="header-right">
      <span class="an-scope" id="an-scope"></span>
      <button class="theme-toggle" id="an-theme" title="Toggle light / dark theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <main class="an-main" id="an-main" aria-busy="true">
    <!-- One filter row scopes every chart below -->
    <div class="an-filters" role="group" aria-label="Filters">
      <div class="chart-time-pills" role="group" aria-label="Time range">
        <button type="button" class="pill" data-an-days="1">24h</button>
        <button type="button" class="pill active" data-an-days="7">7d</button>
        <button type="button" class="pill" data-an-days="14">14d</button>
        <button type="button" class="pill" data-an-days="30">30d</button>
      </div>
      <label class="an-topn">Top
        <select id="an-topn" class="filter-select"><option value="5">5</option><option value="10" selected>10</option></select>
      </label>
      <label class="an-tables"><input type="checkbox" id="an-tables"> Show data tables</label>
      <span class="an-updated" id="an-updated"></span>
    </div>

    <div class="an-message hidden" id="an-message"></div>

    <section class="an-card an-wide" aria-labelledby="an-sev-title">
      <div class="an-card-head"><h2 id="an-sev-title">Report volume by severity</h2><span class="an-sub" id="an-sev-sub"></span></div>
      <div id="an-sev"></div>
    </section>

    <section class="an-kpis" id="an-kpis" aria-label="Key figures"></section>

    <div class="an-grid">
      <section class="an-card" aria-labelledby="an-src-title">
        <div class="an-card-head"><h2 id="an-src-title">Top sources by reports</h2></div>
        <div id="an-src"></div>
      </section>
      <section class="an-card" aria-labelledby="an-cat-title">
        <div class="an-card-head"><h2 id="an-cat-title">Reports by category</h2></div>
        <div id="an-cat"></div>
      </section>
      <section class="an-card" aria-labelledby="an-srct-title">
        <div class="an-card-head"><h2 id="an-srct-title">Top sources over time</h2></div>
        <div id="an-srct"></div>
      </section>
      <section class="an-card" aria-labelledby="an-tech-title">
        <div class="an-card-head"><h2 id="an-tech-title">Top ATT&amp;CK techniques over time</h2><span class="an-sub">Cited or inferred from the reports</span></div>
        <div id="an-tech"></div>
      </section>
    </div>
  </main>

  <div class="an-tip" id="an-tip" role="tooltip"></div>
  <script src="/js/analytics.js"></script>
</body>
</html>
